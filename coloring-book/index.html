<script>
(function () {
  // Unlike the /go/ App Store pages, no scheme hand-off is needed here: an Amazon
  // product page is plain https and loads everywhere, including the Instagram/TikTok
  // in-app webviews that swallow itms-apps://. One hop, owned by us, so a marketplace
  // or ASIN change stays a one-file site edit.
  var t = setTimeout(function () {
    window.location.replace('https://www.amazon.com/dp/B0HFCKBCR9');
  }, 400);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && t) clearTimeout(t);
  });
  window.addEventListener("pagehide", function () { if (t) clearTimeout(t); });
})();
</script>
